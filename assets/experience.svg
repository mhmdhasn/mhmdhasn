<svg xmlns="http://www.w3.org/2000/svg" width="900" height="624" viewBox="0 0 900 624" role="img">
<style>
text{font-family:'Google Sans','Product Sans','Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.pop{animation:pop .7s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.ln{stroke-dasharray:100;animation:dr 2.4s ease-out both}@keyframes dr{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}.pulse{transform-box:fill-box;transform-origin:center;animation:pl 2s ease-in-out infinite}@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<path class="ln" pathLength="100" d="M40 20 V586" stroke="#1B1A17" stroke-width="4" stroke-linecap="round" stroke-dasharray="100"/><g class="pop" style="animation-delay:0.3s"><rect x="85" y="11" width="810" height="104" rx="18" fill="#1B1A17"/><rect x="80" y="6" width="810" height="104" rx="18" fill="#fff" stroke="#1B1A17" stroke-width="3"/><text class="m" x="102" y="36" font-size="13" font-weight="700" fill="#7C5CFF">02/2026 – 07/2026</text><text x="102" y="60" font-size="19" font-weight="800" fill="#1B1A17">Senior Flutter Developer</text><text x="370" y="60" font-size="17" font-weight="600" fill="#5b5649">Infosender</text><text x="102" y="84" font-size="13.5" font-weight="400" fill="#5b5649">'Kassab' rewards app: Clean Architecture, SignalR real-time chat, in-app store with payment APIs, step-tracking</text><text x="102" y="102" font-size="13.5" font-weight="400" fill="#5b5649">to points, OneSignal, GetX.</text><circle class="pulse" cx="40" cy="58.0" r="11" fill="#7C5CFF" stroke="#1B1A17" stroke-width="3.5"/><path d="M51 58.0 H80" stroke="#1B1A17" stroke-width="3"/></g><g class="pop" style="animation-delay:0.55s"><rect x="85" y="133" width="810" height="104" rx="18" fill="#1B1A17"/><rect x="80" y="128" width="810" height="104" rx="18" fill="#fff" stroke="#1B1A17" stroke-width="3"/><text class="m" x="102" y="158" font-size="13" font-weight="700" fill="#7C5CFF">12/2024 – 01/2026</text><text x="102" y="182" font-size="19" font-weight="800" fill="#1B1A17">Senior Flutter Developer</text><text x="370" y="182" font-size="17" font-weight="600" fill="#5b5649">Perceivance</text><text x="102" y="206" font-size="13.5" font-weight="400" fill="#5b5649">Led a team shipping a Bloc/Cubit feature (+28% engagement), a multi-vendor sales system (mobile + web</text><text x="102" y="224" font-size="13.5" font-weight="400" fill="#5b5649">dashboard), offline/online sync, GitHub Actions CI/CD and store releases.</text><circle class="" cx="40" cy="180.0" r="11" fill="#fff" stroke="#1B1A17" stroke-width="3.5"/><path d="M51 180.0 H80" stroke="#1B1A17" stroke-width="3"/></g><g class="pop" style="animation-delay:0.8s"><rect x="85" y="255" width="810" height="104" rx="18" fill="#1B1A17"/><rect x="80" y="250" width="810" height="104" rx="18" fill="#fff" stroke="#1B1A17" stroke-width="3"/><text class="m" x="102" y="280" font-size="13" font-weight="700" fill="#7C5CFF">09/2024 – 12/2024</text><text x="102" y="304" font-size="19" font-weight="800" fill="#1B1A17">Flutter Developer</text><text x="296" y="304" font-size="17" font-weight="600" fill="#5b5649">SafeHand</text><text x="102" y="328" font-size="13.5" font-weight="400" fill="#5b5649">Flutter apps and dashboards, API integration, restaurant ordering system.</text><circle class="" cx="40" cy="302.0" r="11" fill="#fff" stroke="#1B1A17" stroke-width="3.5"/><path d="M51 302.0 H80" stroke="#1B1A17" stroke-width="3"/></g><g class="pop" style="animation-delay:1.05s"><rect x="85" y="377" width="810" height="104" rx="18" fill="#1B1A17"/><rect x="80" y="372" width="810" height="104" rx="18" fill="#fff" stroke="#1B1A17" stroke-width="3"/><text class="m" x="102" y="402" font-size="13" font-weight="700" fill="#7C5CFF">06/2023 – 03/2024</text><text x="102" y="426" font-size="19" font-weight="800" fill="#1B1A17">Flutter Developer</text><text x="296" y="426" font-size="17" font-weight="600" fill="#5b5649">Banan</text><text x="102" y="450" font-size="13.5" font-weight="400" fill="#5b5649">Provider and Bloc, Firebase, payment gateways, APIs.</text><circle class="" cx="40" cy="424.0" r="11" fill="#fff" stroke="#1B1A17" stroke-width="3.5"/><path d="M51 424.0 H80" stroke="#1B1A17" stroke-width="3"/></g><g class="pop" style="animation-delay:1.3s"><rect x="85" y="499" width="810" height="104" rx="18" fill="#1B1A17"/><rect x="80" y="494" width="810" height="104" rx="18" fill="#fff" stroke="#1B1A17" stroke-width="3"/><text class="m" x="102" y="524" font-size="13" font-weight="700" fill="#7C5CFF">06/2023 – 10/2023</text><text x="102" y="548" font-size="19" font-weight="800" fill="#1B1A17">Flutter Developer</text><text x="296" y="548" font-size="17" font-weight="600" fill="#5b5649">NG Company</text><text x="102" y="572" font-size="13.5" font-weight="400" fill="#5b5649">UX/UI-focused apps, performance optimization, remote collaboration.</text><circle class="" cx="40" cy="546.0" r="11" fill="#fff" stroke="#1B1A17" stroke-width="3.5"/><path d="M51 546.0 H80" stroke="#1B1A17" stroke-width="3"/></g>
</svg>