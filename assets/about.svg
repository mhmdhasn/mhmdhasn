<svg xmlns="http://www.w3.org/2000/svg" width="900" height="272" viewBox="0 0 900 272" role="img">
<style>
text{font-family:'Google Sans','Product Sans','Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.pop{animation:pop .7s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.av{animation:bob 3.4s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect x="11" y="11" width="884" height="258" rx="22" fill="#1B1A17"/><rect x="6" y="6" width="884" height="258" rx="22" fill="#fff" stroke="#1B1A17" stroke-width="3"/><g class="av" style="transform-origin:90px 90px"><circle cx="90" cy="90" r="46" fill="#7C5CFF" stroke="#1B1A17" stroke-width="3.5"/><text x="90" y="107" text-anchor="middle" font-size="50" font-weight="800" fill="#fff">M</text></g><text x="90" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#1B1A17">Mohamed</text><text x="90" y="188" text-anchor="middle" font-size="12" fill="#5b5649">Cairo, Egypt</text><text x="170" y="62" font-size="16" font-weight="400" fill="#1B1A17">Senior Flutter/Dart developer with 4+ years shipping production apps on Android, iOS and</text><text x="170" y="86" font-size="16" font-weight="400" fill="#1B1A17">Web across fintech, healthcare, delivery and fan engagement. I pair Flutter with .NET and</text><text x="170" y="110" font-size="16" font-weight="400" fill="#1B1A17">SQL, so I design clean client architecture and also work comfortably with the backend and</text><text x="170" y="134" font-size="16" font-weight="400" fill="#1B1A17">database behind it.</text><text x="170" y="166" font-size="16" font-weight="400" fill="#5b5649">I own features end-to-end, from technical analysis to release and production support, and</text><text x="170" y="190" font-size="16" font-weight="400" fill="#5b5649">I mentor junior developers through code reviews and tests.</text><g class="pop" style="animation-delay:0.3s"><rect x="170" y="222" width="84" height="28" rx="14.0" fill="#E7E0FF" stroke="#1B1A17" stroke-width="2"/><text x="212" y="241" text-anchor="middle" font-size="13" font-weight="700" fill="#1B1A17">4+ years</text></g><g class="pop" style="animation-delay:0.44999999999999996s"><rect x="264.4" y="222" width="131" height="28" rx="14.0" fill="#E7E0FF" stroke="#1B1A17" stroke-width="2"/><text x="330" y="241" text-anchor="middle" font-size="13" font-weight="700" fill="#1B1A17">5 apps shipped</text></g><g class="pop" style="animation-delay:0.6s"><rect x="405.59999999999997" y="222" width="131" height="28" rx="14.0" fill="#7C5CFF" stroke="#1B1A17" stroke-width="2"/><text x="471" y="241" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">50K+ downloads</text></g><g class="pop" style="animation-delay:0.75s"><rect x="546.8" y="222" width="139" height="28" rx="14.0" fill="#E7E0FF" stroke="#1B1A17" stroke-width="2"/><text x="616" y="241" text-anchor="middle" font-size="13" font-weight="700" fill="#1B1A17">+28% engagement</text></g><g class="pop" style="animation-delay:0.8999999999999999s"><rect x="695.8" y="222" width="178" height="28" rx="14.0" fill="#fff" stroke="#1B1A17" stroke-width="2"/><text x="785" y="241" text-anchor="middle" font-size="13" font-weight="700" fill="#1B1A17">Arabic · English B2+</text></g>
</svg>