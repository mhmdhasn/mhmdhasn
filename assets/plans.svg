<rect x="3" y="3" width="894" height="404" rx="26" fill="#F4F0E8" stroke="#1B1A17" stroke-width="3"/><text x="450" y="56" text-anchor="middle" font-size="30" font-weight="800" fill="#1B1A17" letter-spacing="-0.5">Find the Mohamed that fits your workflow</text><text x="450" y="84" text-anchor="middle" font-size="16" fill="#5b5649">From quick fixes to fully end-to-end feature ownership.</text><g class="f1"><rect x="33" y="115" width="256" height="262" rx="20" fill="#1B1A17"/><rect x="28" y="110" width="256" height="262" rx="20" fill="#fff" stroke="#1B1A17" stroke-width="3"/><text x="50" y="150" font-size="22" font-weight="800" fill="#1B1A17">Flutter</text><text x="50" y="178" font-size="13" fill="#4a463e">For apps that need to feel native.</text><circle cx="58" cy="233" r="9" fill="#7C5CFF" stroke="#1B1A17" stroke-width="2"/><path d="M54 233 l3 3 l5 -6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="238" font-size="14" fill="#1B1A17">Android, iOS, Web &amp; Desktop</text><circle cx="58" cy="271" r="9" fill="#7C5CFF" stroke="#1B1A17" stroke-width="2"/><path d="M54 271 l3 3 l5 -6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="276" font-size="14" fill="#1B1A17">Bloc, Cubit, Provider, GetX</text><circle cx="58" cy="309" r="9" fill="#7C5CFF" stroke="#1B1A17" stroke-width="2"/><path d="M54 309 l3 3 l5 -6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="314" font-size="14" fill="#1B1A17">Clean Architecture, Melos</text></g><g class="f2"><rect x="321" y="115" width="256" height="262" rx="20" fill="#1B1A17"/><rect x="316" y="110" width="256" height="262" rx="20" fill="#E7E0FF" stroke="#1B1A17" stroke-width="3"/><text x="338" y="150" font-size="22" font-weight="800" fill="#1B1A17">Flutter + .NET</text><rect x="466" y="97" width="92" height="26" rx="13" fill="#7C5CFF" stroke="#1B1A17" stroke-width="2"/><text x="512" y="115" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Most asked</text><text x="338" y="178" font-size="13" fill="#4a463e">One dev across the whole stack.</text><circle cx="346" cy="233" r="9" fill="#7C5CFF" stroke="#1B1A17" stroke-width="2"/><path d="M342 233 l3 3 l5 -6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="364" y="238" font-size="14" fill="#1B1A17">REST, GraphQL &amp; SignalR</text><circle cx="346" cy="271" r="9" fill="#7C5CFF" stroke="#1B1A17" stroke-width="2"/><path d="M342 271 l3 3 l5 -6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="364" y="276" font-size="14" fill="#1B1A17">.NET backend and SQL</text><circle cx="346" cy="309" r="9" fill="#7C5CFF" stroke="#1B1A17" stroke-width="2"/><path d="M342 309 l3 3 l5 -6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="364" y="314" font-size="14" fill="#1B1A17">OAuth2, JWT, secure auth</text></g><g class="f3"><rect x="609" y="115" width="256" height="262" rx="20" fill="#1B1A17"/><rect x="604" y="110" width="256" height="262" rx="20" fill="#fff" stroke="#1B1A17" stroke-width="3"/><text x="626" y="150" font-size="22" font-weight="800" fill="#1B1A17">Release Captain</text><text x="626" y="178" font-size="13" fill="#4a463e">For shipping without drama.</text><circle cx="634" cy="233" r="9" fill="#7C5CFF" stroke="#1B1A17" stroke-width="2"/><path d="M630 233 l3 3 l5 -6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="652" y="238" font-size="14" fill="#1B1A17">GitHub Actions CI/CD</text><circle cx="634" cy="271" r="9" fill="#7C5CFF" stroke="#1B1A17" stroke-width="2"/><path d="M630 271 l3 3 l5 -6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="652" y="276" font-size="14" fill="#1B1A17">Play Console &amp; App Store</text><circle cx="634" cy="309" r="9" fill="#7C5CFF" stroke="#1B1A17" stroke-width="2"/><path d="M630 309 l3 3 l5 -6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="652" y="314" font-size="14" fill="#1B1A17">Unit, widget &amp; integration tests</text></g>
