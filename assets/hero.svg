<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
text{font-family:'Google Sans','Product Sans','Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}

.chip{opacity:0;animation:chip 16.0s infinite}
@keyframes chip{0%{opacity:0;transform:translateY(10px)}3%{opacity:1;transform:translateY(0)}17%{opacity:1;transform:translateY(0)}20%{opacity:0;transform:translateY(-10px)}100%{opacity:0}}
.bob{animation:bob 3.4s ease-in-out infinite} .bob2{animation:bob 4.2s ease-in-out infinite reverse}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.blink{animation:blink 1s steps(1) infinite} @keyframes blink{50%{opacity:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important} [class^=r]{opacity:1!important} [class^=w]{transform:scaleX(0)!important} .chip{display:none} .chip:nth-of-type(1){display:inline;opacity:1}}
</style>

