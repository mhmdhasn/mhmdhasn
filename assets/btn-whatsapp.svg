<svg xmlns="http://www.w3.org/2000/svg" width="296" height="96" viewBox="0 0 296 96" role="img">
<style>
text{font-family:'Google Sans','Product Sans','Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.pop{animation:pop .7s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.bt{animation:fl 4.5s ease-in-out 1.2s infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.ic{transform-box:fill-box;transform-origin:center;animation:ic 2.6s ease-in-out 1.2s infinite}@keyframes ic{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-12deg)}95%{transform:rotate(10deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
